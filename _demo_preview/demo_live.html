<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YogaAlign — Live Step-by-Step Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
  <style>
    .video-container {
      position: relative;
      width: 100%;
      background: linear-gradient(135deg, #1e1b3a 0%, #2d2454 50%, #1a1530 100%);
      border-radius: var(--radius-lg);
      overflow: hidden;
      aspect-ratio: 16/9;
      margin-bottom: var(--space-lg);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-placeholder {
      color: rgba(255,255,255,0.35);
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      text-align: center;
    }
    .pose-silhouette {
      width: 90px; height: 90px; margin: 0 auto 12px;
      opacity: 0.5;
    }
    .step-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(167, 139, 250, 0.3);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      text-align: center;
      margin-bottom: var(--space-lg);
    }
    .step-number {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      color: var(--color-medium);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .step-instruction {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      margin-bottom: var(--space-md);
    }
    .ai-feedback {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: var(--radius-md);
      font-size: 1.1rem;
      color: var(--text-secondary);
      border-left: 3px solid var(--color-medium);
      text-align: left;
    }
    .controls { display: flex; gap: 12px; justify-content: center; }
    .btn-stop {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 14px 24px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-weight: 600;
      cursor: pointer;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 10;
      color: #fff;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-high);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(248, 113, 113, 0); }
      100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0); }
    }
  </style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <h1 class="logo-text">YogaAlign Live</h1>
        <p class="logo-subtitle">Real-Time Step-by-Step Coach</p>
      </div>
    </div>
  </header>

  <main class="main">
    <section id="live-section">
      <div class="video-container">
        <div class="status-indicator">
          <div class="status-dot"></div>
          <span>Watching...</span>
        </div>
        <div class="video-placeholder">
          <svg class="pose-silhouette" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="18" r="10" stroke="white" stroke-width="3"/>
            <line x1="50" y1="28" x2="50" y2="60" stroke="white" stroke-width="3"/>
            <line x1="50" y1="38" x2="25" y2="30" stroke="white" stroke-width="3"/>
            <line x1="50" y1="38" x2="75" y2="55" stroke="white" stroke-width="3"/>
            <line x1="50" y1="60" x2="30" y2="90" stroke="white" stroke-width="3"/>
            <line x1="50" y1="60" x2="68" y2="88" stroke="white" stroke-width="3"/>
          </svg>
          Live camera feed + MediaPipe landmark overlay
        </div>
      </div>

      <div class="step-card">
        <div class="step-number">Step 4 of 7</div>
        <div class="step-instruction">Exhale, slowly bend to the right side and place the right hand fingers just behind the right foot.</div>
        <div class="ai-feedback">⚠️ Keep adjusting. (Hips not yet aligned for this step — confidence 71.4%)</div>
      </div>

      <div class="controls">
        <button class="btn-stop" id="btn-stop">Stop Practice</button>
      </div>
    </section>
  </main>
</body>
</html>

<svg viewBox="0 0 700 1420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,sans-serif">
<title>ML Pipeline Flow Diagram — Yoga Pose Correction AI</title>
<desc>End-to-end flow from camera input through MediaPipe, feature engineering, MLP classifier, posture descriptor matching, decision logic, feedback generation, temporal smoothing, and digital twin streaming.</desc>
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#888780"/>
  </marker>
  <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#534AB7"/>
  </marker>
  <marker id="arr-t" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#0F6E56"/>
  </marker>
  <marker id="arr-a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#BA7517"/>
  </marker>
  <marker id="arr-c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#993C1D"/>
  </marker>
</defs>

<!-- SECTION LABELS -->
<text x="10" y="22" font-size="10" fill="#B4B2A9" font-weight="500" letter-spacing="1">INPUT</text>
<text x="10" y="162" font-size="10" fill="#B4B2A9" font-weight="500" letter-spacing="1">FEATURE ENGINEERING</text>
<text x="10" y="342" font-size="10" fill="#B4B2A9" font-weight="500" letter-spacing="1">INFERENCE</text>
<text x="10" y="602" font-size="10" fill="#B4B2A9" font-weight="500" letter-spacing="1">DECISION</text>
<text x="10" y="762" font-size="10" fill="#B4B2A9" font-weight="500" letter-spacing="1">FEEDBACK</text>
<text x="10" y="982" font-size="10" fill="#B4B2A9" font-weight="500" letter-spacing="1">TEMPORAL SMOOTHING</text>
<text x="10" y="1162" font-size="10" fill="#B4B2A9" font-weight="500" letter-spacing="1">STREAMING OUTPUT</text>

<!-- INPUT -->
<rect x="220" y="30" width="260" height="54" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="350" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Camera feed</text>
<text x="350" y="70" text-anchor="middle" font-size="11" fill="#185FA5">Live RGB video stream</text>

<line x1="350" y1="84" x2="350" y2="110" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="180" y="110" width="340" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="350" y="132" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">MediaPipe BlazePose</text>
<text x="350" y="150" text-anchor="middle" font-size="11" fill="#534AB7">33 landmarks x 3D (x, y, z) — normalised to [0,1]</text>

<!-- FEATURE ENGINEERING -->
<line x1="350" y1="164" x2="350" y2="178" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="30" y="178" width="180" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="120" y="200" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Landmark XYZ</text>
<text x="120" y="216" text-anchor="middle" font-size="10" fill="#0F6E56">33 landmarks x 3</text>
<text x="120" y="230" text-anchor="middle" font-size="10" fill="#0F6E56">= 99 features</text>

<rect x="260" y="178" width="180" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="350" y="200" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Joint angles</text>
<text x="350" y="216" text-anchor="middle" font-size="10" fill="#0F6E56">knee, hip, ankle,</text>
<text x="350" y="230" text-anchor="middle" font-size="10" fill="#0F6E56">spine, shoulder x 2 = 12</text>

<rect x="490" y="178" width="180" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="580" y="200" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">IMU (zero-filled)</text>
<text x="580" y="216" text-anchor="middle" font-size="10" fill="#0F6E56">accel + gyro</text>
<text x="580" y="230" text-anchor="middle" font-size="10" fill="#0F6E56">= 6 features</text>

<line x1="280" y1="164" x2="120" y2="178" stroke="#888780" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="350" y1="164" x2="350" y2="178" stroke="#888780" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="420" y1="164" x2="580" y2="178" stroke="#888780" stroke-width="1.2" marker-end="url(#arr)"/>

<line x1="120" y1="242" x2="120" y2="268" stroke="#888780" stroke-width="1.2"/>
<line x1="350" y1="242" x2="350" y2="268" stroke="#888780" stroke-width="1.2"/>
<line x1="580" y1="242" x2="580" y2="268" stroke="#888780" stroke-width="1.2"/>
<line x1="120" y1="268" x2="580" y2="268" stroke="#888780" stroke-width="1.2"/>
<line x1="350" y1="268" x2="350" y2="282" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="200" y="282" width="300" height="44" rx="8" fill="#085041" stroke="#085041" stroke-width="1"/>
<text x="350" y="302" text-anchor="middle" font-size="12" font-weight="500" fill="#9FE1CB">117-dim feature vector</text>
<text x="350" y="318" text-anchor="middle" font-size="10" fill="#5DCAA5">concatenate [99 + 12 + 6]</text>

<!-- INFERENCE -->
<line x1="280" y1="326" x2="170" y2="352" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="420" y1="326" x2="530" y2="352" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr-t)"/>

<rect x="30" y="352" width="270" height="100" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="165" y="374" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">MLP Classifier</text>
<text x="165" y="392" text-anchor="middle" font-size="10" fill="#534AB7">512 -> 256 -> 128 -> 64 -> 74</text>
<text x="165" y="408" text-anchor="middle" font-size="10" fill="#534AB7">Softmax over 74 step labels</text>
<text x="165" y="424" text-anchor="middle" font-size="10" fill="#534AB7">Filter to current pose steps only</text>
<text x="165" y="440" text-anchor="middle" font-size="10" fill="#534AB7">Re-normalise confidence score</text>

<rect x="400" y="352" width="270" height="100" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="535" y="374" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Posture Descriptors</text>
<text x="535" y="392" text-anchor="middle" font-size="10" fill="#0F6E56">18 descriptors computed live</text>
<text x="535" y="408" text-anchor="middle" font-size="10" fill="#0F6E56">Compare vs step_reference_stats.json</text>
<text x="535" y="424" text-anchor="middle" font-size="10" fill="#0F6E56">(median/MAD per descriptor per step)</text>
<text x="535" y="440" text-anchor="middle" font-size="10" fill="#0F6E56">z-score per descriptor</text>

<line x1="165" y1="452" x2="165" y2="480" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr-b)"/>
<rect x="50" y="480" width="230" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="165" y="502" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">classifierIsMatch</text>
<text x="165" y="518" text-anchor="middle" font-size="10" fill="#534AB7">bestLabel == expected</text>
<text x="165" y="532" text-anchor="middle" font-size="10" fill="#534AB7">OR score >= 85% of best</text>

<line x1="535" y1="452" x2="535" y2="480" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr-t)"/>
<rect x="420" y="480" width="230" height="54" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="535" y="502" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">descriptorIsMatch</text>
<text x="535" y="518" text-anchor="middle" font-size="10" fill="#0F6E56">fraction within z &lt; 1.4</text>
<text x="535" y="532" text-anchor="middle" font-size="10" fill="#0F6E56">>= 70% descriptors pass</text>

<!-- DECISION -->
<line x1="165" y1="534" x2="240" y2="612" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="535" y1="534" x2="460" y2="612" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr-t)"/>

<polygon points="350,612 430,652 350,692 270,652" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="350" y="648" text-anchor="middle" font-size="11" font-weight="500" fill="#633806">isMatch</text>
<text x="350" y="664" text-anchor="middle" font-size="10" fill="#854F0B">OR logic</text>

<polygon points="350,700 430,730 350,760 270,730" fill="#FAC775" stroke="#BA7517" stroke-width="2"/>
<text x="350" y="726" text-anchor="middle" font-size="11" font-weight="500" fill="#412402">isStrongMatch</text>
<text x="350" y="742" text-anchor="middle" font-size="10" fill="#633806">AND logic</text>
<line x1="350" y1="692" x2="350" y2="700" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr-a)"/>

<!-- FEEDBACK -->
<line x1="430" y1="730" x2="540" y2="772" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr-t)"/>
<text x="496" y="760" text-anchor="middle" font-size="10" fill="#0F6E56">true</text>

<line x1="270" y1="730" x2="160" y2="772" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arr-c)"/>
<text x="202" y="760" text-anchor="middle" font-size="10" fill="#993C1D">false</text>

<rect x="440" y="772" width="220" height="44" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="550" y="794" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">"Looking good"</text>
<text x="550" y="810" text-anchor="middle" font-size="10" fill="#0F6E56">hold the position</text>

<rect x="30" y="772" width="230" height="80" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="145" y="794" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C">Corrective feedback</text>
<text x="145" y="810" text-anchor="middle" font-size="10" fill="#993C1D">rank descriptors by |z-score|</text>
<text x="145" y="824" text-anchor="middle" font-size="10" fill="#993C1D">top 2 -> natural language phrase</text>
<text x="145" y="838" text-anchor="middle" font-size="10" fill="#993C1D">"Widen your stance" etc.</text>

<rect x="30" y="872" width="230" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="145" y="894" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">Ollama LLM fallback</text>
<text x="145" y="910" text-anchor="middle" font-size="10" fill="#5F5E5A">triggers after 7s violation</text>
<text x="145" y="924" text-anchor="middle" font-size="10" fill="#5F5E5A">llama3.2 / llava vision model</text>
<line x1="145" y1="852" x2="145" y2="872" stroke="#888780" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
<text x="156" y="865" font-size="9" fill="#888780">7s timeout</text>

<!-- TEMPORAL SMOOTHING -->
<line x1="350" y1="760" x2="350" y2="992" stroke="#888780" stroke-width="1.5" stroke-dasharray="5,3"/>
<line x1="550" y1="816" x2="550" y2="992" stroke="#888780" stroke-width="1.2" stroke-dasharray="5,3"/>
<line x1="350" y1="992" x2="550" y2="992" stroke="#888780" stroke-width="1.2"/>
<line x1="450" y1="992" x2="450" y2="1002" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="200" y="1002" width="300" height="80" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="1"/>
<text x="350" y="1024" text-anchor="middle" font-size="12" font-weight="500" fill="#4B1528">Rolling window (client)</text>
<text x="350" y="1042" text-anchor="middle" font-size="10" fill="#993556">6 frames at 500ms = ~3s window</text>
<text x="350" y="1058" text-anchor="middle" font-size="10" fill="#993556">stepComplete if 5 / 6 frames match</text>
<text x="350" y="1074" text-anchor="middle" font-size="10" fill="#993556">debounce: 2 frames before showing</text>

<line x1="350" y1="1082" x2="350" y2="1112" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="200" y="1112" width="300" height="44" rx="8" fill="#D4537E" stroke="#D4537E" stroke-width="1"/>
<text x="350" y="1134" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Advance to next step</text>
<text x="350" y="1150" text-anchor="middle" font-size="10" fill="#F4C0D1">2s celebration delay -> stepIndex++</text>

<!-- STREAMING -->
<line x1="350" y1="1156" x2="350" y2="1182" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="30" y="1182" width="180" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="120" y="1204" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">WebSocket — ideal</text>
<text x="120" y="1220" text-anchor="middle" font-size="10" fill="#534AB7">ideal landmarks</text>
<text x="120" y="1234" text-anchor="middle" font-size="10" fill="#534AB7">once per step change</text>

<rect x="260" y="1182" width="180" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="350" y="1204" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">WebSocket — deviation</text>
<text x="350" y="1220" text-anchor="middle" font-size="10" fill="#534AB7">real - ideal per landmark</text>
<text x="350" y="1234" text-anchor="middle" font-size="10" fill="#534AB7">every frame</text>

<rect x="490" y="1182" width="180" height="70" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="580" y="1204" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C">UDP -> Unreal Engine</text>
<text x="580" y="1220" text-anchor="middle" font-size="10" fill="#185FA5">33->17 bone mapping</text>
<text x="580" y="1234" text-anchor="middle" font-size="10" fill="#185FA5">10.20.15.206 : 5000</text>

<line x1="280" y1="1182" x2="180" y2="1182" stroke="#888780" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="350" y1="1156" x2="350" y2="1182" stroke="#888780" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="420" y1="1182" x2="520" y2="1182" stroke="#888780" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="200" y="1278" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="350" y="1300" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A">frame_log.jsonl</text>
<text x="350" y="1316" text-anchor="middle" font-size="10" fill="#5F5E5A">full per-frame record — appended every frame</text>
<line x1="120" y1="1252" x2="260" y2="1278" stroke="#888780" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
<line x1="350" y1="1252" x2="350" y2="1278" stroke="#888780" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
<line x1="580" y1="1252" x2="440" y2="1278" stroke="#888780" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

<!-- LEGEND -->
<rect x="30" y="1340" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="48" y="1351" font-size="10" fill="#5F5E5A">ML / classifier</text>
<rect x="130" y="1340" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="148" y="1351" font-size="10" fill="#5F5E5A">feature / descriptor</text>
<rect x="270" y="1340" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="288" y="1351" font-size="10" fill="#5F5E5A">decision</text>
<rect x="360" y="1340" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="378" y="1351" font-size="10" fill="#5F5E5A">feedback</text>
<rect x="450" y="1340" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="468" y="1351" font-size="10" fill="#5F5E5A">streaming</text>
<rect x="545" y="1340" width="12" height="12" rx="2" fill="#FBEAF0" stroke="#D4537E" stroke-width="1"/>
<text x="563" y="1351" font-size="10" fill="#5F5E5A">temporal</text>
</svg>
